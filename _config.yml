# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Timur Akishev, Ph.D."
name: "Timur Akishev"
copyright: "Timur Akishev"
email: "t.akishev@kimep.kz"
url: "https://timurakishev.github.io"
baseurl: ""

description: >- # this means to ignore newlines until "baseurl:"
  Personal academic website of Timur Akishev,
  featuring research papers, teaching notes, projects,
  and occasional blog posts.

github_username: timurakishev
minimal_mistakes_skin: dark
locale: "en-US"
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /blog/:title/
timezone: Asia/Almaty

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Timur Akishev"
  avatar: "/assets/images/avatar.jpg"
  bio: "Corpus linguist"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=UtJBQE0AAAAJ&hl=en"

    - label: "Scopus"
      icon: "fas fa-fw fa-book"
      url: "https://www.scopus.com/authid/detail.uri?authorId=60377272900"

    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0009-3684-5500"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/timur-akishev/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
  
# Hide RSS Feed link
atom_feed:
  hide: true
